
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean up the shared workspace before starting the pipeline.
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsUser: 0
      script: |
        #!/bin/sh
        set -eu

        echo "Cleaning workspace..."
        find "$(workspaces.source.path)" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        echo "Workspace cleanup completed."

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Run Python unit tests using the Nose testing framework.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments passed to nosetests.
      type: string
      default: "-v"
  steps:
    - name: run-nose-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        echo "Installing Python dependencies..."
        python -m pip install --upgrade pip wheel
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

        pip install nose

        echo "Running Nose unit tests..."
        nosetests $(params.args)

        echo "Nose unit tests completed successfully."
